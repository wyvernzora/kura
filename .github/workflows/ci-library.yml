name: ci-library

on:
  push:
    branches: [main]
    paths:
      - "services/library-manager/**"
      - "services/gateway/web/src/api/types.gen.ts"
      - ".github/workflows/ci-library.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "services/library-manager/**"
      - "services/gateway/web/src/api/types.gen.ts"
      - ".github/workflows/ci-library.yml"

concurrency:
  group: ci-library-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/library-manager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: services/library-manager/go.mod
          cache: true

      # gofmt drift check: -l lists offenders without mutation.
      - name: gofmt
        run: |
          drift=$(gofmt -l cmd internal pkg)
          if [ -n "$drift" ]; then
            echo "::error::gofmt drift in:" >&2
            echo "$drift" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # install-mode=goinstall compiles golangci-lint against the toolchain
      # setup-go installed; pinned to match the local version.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.12.2
          install-mode: goinstall
          working-directory: services/library-manager

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build -trimpath -o bin/kura-library-manager ./cmd/kura-library-manager

  # Regenerate web/src/api/types.gen.ts and fail on drift.
  gen-check:
    name: gen-ts drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: services/library-manager/go.mod
          cache: true

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          package_json_file: services/gateway/web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/gateway/web/pnpm-lock.yaml

      - name: pnpm install (for biome)
        working-directory: services/gateway/web
        run: pnpm install --frozen-lockfile

      - name: regenerate types
        run: make -C services/library-manager gen-ts

      - name: assert no drift
        run: |
          if ! git diff --exit-code -- services/gateway/web/src/api/types.gen.ts; then
            echo "::error::types.gen.ts is stale; run 'make -C services/library-manager gen-ts' and commit" >&2
            exit 1
          fi
