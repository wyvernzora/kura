name: publish

# Main is a suite-level deployment channel: after every applicable CI workflow
# passes, all component images are rebuilt from the same commit and their
# mutable :main tags advance together. Version tags remain optional releases.
#
# Nothing here prunes ghcr. Downstream repos pin :main by digest — the form
# Renovate can track and bump on its own — so the manifest :main just moved
# off of is still load-bearing even though it is now untagged, and deleting
# it 404s their builds. Storage is free; do not add a cleanup job back.

on:
  workflow_run:
    workflows: [ci-product]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.6.0"
        required: true
        type: string

concurrency:
  group: publish-${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.verify.outputs.version }}
      sha: ${{ steps.verify.outputs.sha }}
      publish: ${{ steps.verify.outputs.publish }}
      release: ${{ steps.verify.outputs.release }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Resolve publication and verify CI
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git fetch --force --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="$WORKFLOW_RUN_SHA"
            tip_sha="$(git rev-parse origin/main)"
            if [ "$sha" != "$tip_sha" ]; then
              echo "Superseded main commit $sha; current tip is $tip_sha."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            version="main-${sha:0:7}"
            release=false

            # ci-product is normally the slowest workflow, but do not rely on
            # that timing. Wait for every applicable ci-* push run for this
            # commit and publish only when the latest run of each is green.
            deadline=$((SECONDS + 1800))
            while :; do
              runs="$(
                gh api "repos/$REPOSITORY/actions/runs" \
                  --method GET \
                  -f branch=main \
                  -f event=push \
                  -f head_sha="$sha" \
                  -f per_page=100
              )"
              latest_runs="$(
                jq -c '
                  [.workflow_runs[] | select(.name | startswith("ci-"))]
                  | sort_by(.name)
                  | group_by(.name)
                  | map(max_by(.run_number))
                ' <<<"$runs"
              )"

              failed="$(
                jq -r '.[] | select(.status == "completed" and .conclusion != "success") | "\(.name): \(.conclusion) \(.html_url)"' \
                  <<<"$latest_runs"
              )"
              if [ -n "$failed" ]; then
                echo "::error::Main commit $sha has failed CI:"
                echo "$failed"
                exit 1
              fi

              pending="$(jq -r '.[] | select(.status != "completed") | .name' <<<"$latest_runs")"
              lint_green="$(jq -r 'any(.[]; .name == "ci-lint" and .conclusion == "success")' <<<"$latest_runs")"
              product_green="$(jq -r 'any(.[]; .name == "ci-product" and .conclusion == "success")' <<<"$latest_runs")"
              if [ -z "$pending" ] && [ "$lint_green" = true ] && [ "$product_green" = true ]; then
                jq -r '.[] | "\(.name) passed: \(.html_url)"' <<<"$latest_runs"
                break
              fi

              if (( SECONDS >= deadline )); then
                echo "::error::Timed out waiting for all CI on main commit $sha."
                exit 1
              fi
              echo "Waiting for all CI on $sha. Pending: ${pending:-required workflow registration}"
              sleep 30
            done
          else
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              version="${{ inputs.version }}"
            else
              version="$GITHUB_REF_NAME"
            fi
            if [[ ! "$version" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
              echo "version must look like v0.6.0, got $version" >&2
              exit 1
            fi

            git fetch --force --no-tags origin "+refs/tags/$version:refs/tags/$version"
            sha="$(git rev-parse "$version^{commit}")"
            release=true

            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::Release tag $version points to $sha, which is not reachable from origin/main."
              exit 1
            fi

            for workflow in ci-lint.yml ci-product.yml; do
              ci_run_url="$(
                gh api "repos/$REPOSITORY/actions/workflows/$workflow/runs" \
                  --method GET \
                  -f branch=main \
                  -f event=push \
                  -f head_sha="$sha" \
                  -f status=completed \
                  --jq '.workflow_runs[] | select(.conclusion == "success") | .html_url' |
                  head -n 1
              )"
              if [ -z "$ci_run_url" ]; then
                echo "::error::Release commit $sha does not have a successful $workflow push run on main."
                exit 1
              fi
              echo "$workflow passed: $ci_run_url"
            done
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Publishing Kura suite $version from $sha."

  publish-library:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/wyvernzora/kura/library-manager
          tags: |
            type=raw,value=main,enable=${{ needs.verify.outputs.release != 'true' }}
            type=raw,value=${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.release == 'true' }}
          labels: |
            org.opencontainers.image.title=kura-server
            org.opencontainers.image.description=Anime-first library manager
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build & push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: services/library-manager
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  publish-n8n:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/wyvernzora/kura/n8n-nodes
          tags: |
            type=raw,value=main,enable=${{ needs.verify.outputs.release != 'true' }}
            type=raw,value=${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.release == 'true' }}
          labels: |
            org.opencontainers.image.title=kura-n8n-nodes
            org.opencontainers.image.description=Kura suite custom nodes for n8n (init container)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build & push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: integrations/n8n/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=release-n8n-nodes
          cache-to: type=gha,mode=max,scope=release-n8n-nodes
          provenance: false

  publish-gateway:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/wyvernzora/kura/gateway
          tags: |
            type=raw,value=main,enable=${{ needs.verify.outputs.release != 'true' }}
            type=raw,value=${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.release == 'true' }}
          labels: |
            org.opencontainers.image.title=kura-gateway
            org.opencontainers.image.description=Kura suite gateway (Caddy + MCP bridge + SPA)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: services/gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=release-gateway
          cache-to: type=gha,mode=max,scope=release-gateway
          provenance: false

  publish-releases:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: kura-release-indexer
            image: ghcr.io/wyvernzora/kura/release-indexer
            context: services/release-indexer
            file: services/release-indexer/Dockerfile
            build_args: ''
            description: Anime release indexer, source crawlers, and match work queue
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=main,enable=${{ needs.verify.outputs.release != 'true' }}
            type=raw,value=${{ needs.verify.outputs.version }},enable=${{ needs.verify.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.release == 'true' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.component }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            COMMIT=${{ needs.verify.outputs.sha }}
            ${{ matrix.build_args }}
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}
          provenance: false

  github-release:
    needs: [verify, publish-library, publish-n8n, publish-gateway, publish-releases]
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "GitHub release $VERSION already exists."
            exit 0
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag
