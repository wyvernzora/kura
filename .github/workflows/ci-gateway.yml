name: ci-gateway

on:
  push:
    branches: [main]
    paths:
      - "services/gateway/**"
      - ".github/workflows/ci-gateway.yml"
  pull_request:
    paths:
      - "services/gateway/**"
      - ".github/workflows/ci-gateway.yml"

concurrency:
  group: ci-gateway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: services/gateway/go.mod
          cache: true

      - name: gofmt
        run: |
          drift=$(gofmt -l cmd internal)
          if [ -n "$drift" ]; then
            echo "::error::gofmt drift in:" >&2
            echo "$drift" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.12.2
          install-mode: goinstall
          working-directory: services/gateway

      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build -trimpath -o bin/kura-mcp-bridge ./cmd/kura-mcp-bridge

  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/gateway/web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: services/gateway/web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/gateway/web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Build first: the router plugin emits routeTree.gen.ts, which
      # typecheck imports; the file is gitignored.
      - name: build
        run: pnpm build

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test
