name: ci-releases

on:
  push:
    branches: [main]
    paths:
      - "services/release-indexer/**"
      - "cli/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci-releases.yml"
  pull_request:
    paths:
      - "services/release-indexer/**"
      - "cli/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ci-releases.yml"

concurrency:
  group: ci-releases-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/release-indexer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: services/release-indexer/go.mod
          cache: true

      # gofmt drift check across the release-indexer module.
      - name: gofmt
        run: |
          drift=$(gofmt -l cmd internal pkg sources)
          if [ -n "$drift" ]; then
            echo "::error::gofmt drift in:" >&2
            echo "$drift" >&2
            exit 1
          fi

      # Workspace drift check runs at the monorepo root: a `use` added
      # without `go work sync`, or sync-promoted versions missing from a
      # module's standalone go.sum, would otherwise pass silently.
      - name: go work sync drift
        working-directory: .
        run: |
          go work sync
          git diff --exit-code

      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: vet / build / test / lint
        env:
          GOWORK: "off"
        run: |
          go vet ./...
          go build ./...
          go build -tags=conformance ./...
          go test -race -count=1 -tags=conformance ./...
          golangci-lint run ./...

      - name: go build (release binary)
        env:
          GOWORK: "off"
        run: go build -trimpath -o bin/kura-release-indexer ./cmd/kura-release-indexer

  # Real-binary smoke over the deployable shape: real Postgres via
  # testcontainers, builds + runs cmd/kura-release-indexer.
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/release-indexer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: services/release-indexer/go.mod
          cache: true

      - name: real-binary smoke
        run: go test -tags=smoke -run TestSmoke -count=1 ./cmd/kura-release-indexer

  # End-to-end consolidated deploy shape: one release-indexer image crawls fake
  # DMHY in-process and persists to Postgres before the match workflow runs.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/release-indexer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: services/release-indexer/go.mod
          cache: true

      - name: end-to-end workflow
        run: go test -tags=e2e -run TestEndToEndWorkflow -count=1 ./e2e
