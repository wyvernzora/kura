# kura-gateway MCP bridge configuration.
#
# Leaf addresses are deliberately absent: the bridge reads
# KURA_LIBRARY_UPSTREAM and KURA_RELEASES_UPSTREAM, the same two variables
# Caddy interpolates, and pairs each with its fixed REST prefix
# (/api/library/v1, /api/releases/v1) plus the /healthz probe. One
# declaration per leaf, nothing to desync.
#
# There is no version key either — the bridge stamps its version from ldflags,
# as both leaves do. A ConfigMap value would lag the image tag and make
# /api/v1/health and X-Kura-Version lie.

[server]
# Loopback only. Binding this to the Pod network would publish an
# unauthenticated MCP endpoint reachable without passing Pomerium.
address = "127.0.0.1:8081"

# Prometheus exposition (kura_mcp_* tool metrics), read-only, on the Pod
# network like the leaves' :9090 listeners. Caddy owns :9090 in this Pod.
metrics_address = ":9091"

[api]
request_timeout = "30s"
max_response_bytes = 1048576
component_timeout = "1s"

[mcp]
# Idle MCP sessions are reclaimed after this long. The SDK's timer is
# refcounted by POSTs only, so an open SSE stream does not keep a session
# alive: the value must exceed the longest gap between a client's tool
# calls. Long enough that no live client reaches it, short enough to
# reclaim after a client crash. It cannot be disabled — n8n's MCP client
# closes locally and never sends DELETE, so this is the only reclaim path.
# Generous rather than tight because clients do not recover from a legal
# session termination: https://github.com/modelcontextprotocol/typescript-sdk/issues/1708
session_timeout = "2h"
