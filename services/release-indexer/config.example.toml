# This table and all its fields are optional.
[database]

# Optional; default = "releases". Must match [a-z_][a-z0-9_]{0,62}.
schema = "releases"


# All fields in this table are optional.
[server]

# Optional; default = ":8080"
addr = ":8080"

# Optional; default = ":9090". Serves /metrics and nothing else, and must
# differ from `addr`: with no authentication in the service, a network policy
# that permits a Prometheus scrape of a shared port would also permit the
# ingest, claim, and submit routes.
metrics_addr = ":9090"

# Optional; default = "info". Allowed: debug, info, warn, error.
log_level = "info"


# This table and all its fields are optional.
[queue]

# Optional; default = 3.
max_attempts = 3


# This source table is optional. If absent, DMHY's scheduled loop is disabled;
# on-demand crawls use the defaults below.
[sources.dmhy]

# Optional; default = true when this table is present.
enabled = false

# Required when enabled.
interval = "5m"

# Required when enabled. Every run re-reads the listing back to
# now − settle_window; listing changes older than that are out of contract
# (catch them with `kura crawl <source> <lookback>` — see operations.md).
# Accepts "d" (days) and "w" (weeks) suffixes in addition to Go durations.
settle_window = "24h"

# Optional; default = "10m". Bounds one scheduled run; must be greater than
# request_timeout.
timeout = "10m"

# Optional; default = "180s". Bounds one page fetch. DMHY's deep-history
# pages have been observed above 60s, hence the large default.
request_timeout = "180s"

# Optional; default = "https://share.dmhy.org".
url = "https://share.dmhy.org"

# Optional; default = "2". DMHY category identifier used in the source URL.
category = "2"

# Optional; default = 0.5. Must be > 0. It also paces on-demand crawls
# while the scheduled loop is disabled. This is a hard ceiling; the fetcher
# also waits the rolling mean of the last three request durations after each
# request and retries transient failures up to three attempts with capped
# exponential backoff (2s initial, 30s maximum).
max_rps = 0.5

# Optional; default = "5m". Set to "0s" to disable caching.
cache_ttl = "5m"


# This source table is optional. If absent, Nyaa's scheduled loop is disabled;
# on-demand crawls use the defaults below.
[sources.nyaa]

# Optional; default = true when this table is present.
enabled = false

# Required when enabled.
interval = "5m"

# Required when enabled. See sources.dmhy.settle_window.
settle_window = "24h"

# Optional; default = "2m". Bounds one scheduled run; must be greater than
# request_timeout.
timeout = "2m"

# Optional; default = "30s". Bounds one page fetch.
request_timeout = "30s"

# Optional; default = "https://nyaa.si".
url = "https://nyaa.si"

# Optional; default = "".
query = ""

# Optional; default = "1_4".
category = "1_4"

# Optional; default = "0".
filter = "0"

# Optional; default = 0.5. Must be > 0. It also paces on-demand crawls
# while the scheduled loop is disabled. See sources.dmhy.max_rps for the
# shared adaptive cooldown and retry policy.
max_rps = 0.5

# Optional; default = "5m". Shared by scheduled and cursor crawls so a
# mid-page continuation can reuse the same listing snapshot. Set to "0s" to
# disable caching.
cache_ttl = "5m"
