[database]
schema = "releases"

[server]
addr = ":8080"
metrics_addr = ":9090"
log_level = "debug"

[queue]
max_attempts = 3

[sources.dmhy]
interval = "5m"
settle_window = "24h"
timeout = "10m"
request_timeout = "180s"
url = "https://share.dmhy.org"
category = "2"
max_rps = 0.5
cache_ttl = "10m"

[sources.nyaa]
interval = "5m"
settle_window = "24h"
timeout = "2m"
request_timeout = "30s"
url = "https://nyaa.si"
query = ""
category = "1_4"
filter = "0"
max_rps = 0.5
